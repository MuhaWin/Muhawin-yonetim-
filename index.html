<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MW Yönetim">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>MuhaWin Yönetim</title>
<style>
:root{--bg:#f4f2ec;--kart:#fff;--yazi:#1d2430;--soluk:#667085;--cizgi:#e3e0d8;--ana:#1f3a5f;--ana-y:#fff;--vurgu:#2f6fb3;
  --iyi-bg:#e3f4ea;--iyi:#17663a;--uyar-bg:#fdf0d9;--uyar:#8a5a00;--kotu-bg:#fde6e4;--kotu:#a3271b;--gri-bg:#eef0f3;--gri:#475467;
  --golge:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--kart:#1b212a;--yazi:#e7eaee;--soluk:#98a2b3;--cizgi:#2b3340;--ana:#7fb0e6;--ana-y:#0e1621;--vurgu:#7fb0e6;
  --iyi-bg:#123323;--iyi:#7fd6a2;--uyar-bg:#3a2c0e;--uyar:#f3c66b;--kotu-bg:#3d1714;--kotu:#ff9b8f;--gri-bg:#252c37;--gri:#c3cad5;--golge:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--kart:#1b212a;--yazi:#e7eaee;--soluk:#98a2b3;--cizgi:#2b3340;--ana:#7fb0e6;--ana-y:#0e1621;--vurgu:#7fb0e6;
  --iyi-bg:#123323;--iyi:#7fd6a2;--uyar-bg:#3a2c0e;--uyar:#f3c66b;--kotu-bg:#3d1714;--kotu:#ff9b8f;--gri-bg:#252c37;--gri:#c3cad5;--golge:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.giris{padding-bottom:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--cizgi);border-radius:10px;background:var(--kart);font-size:16px}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--soluk);margin:10px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--cizgi);background:var(--kart);font-weight:600;cursor:pointer}
.btn.ana{background:var(--ana);border-color:var(--ana);color:var(--ana-y)}
.btn.tehlike{color:var(--kotu);border-color:var(--kotu)}
.btn.kucuk{min-height:36px;padding:0 12px;font-size:14px}
.btn.tam{width:100%}
.btn:disabled{opacity:.5}
.lnk{background:none;border:0;padding:0;color:var(--vurgu);font-weight:600;cursor:pointer;text-align:left}
header.ust{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--cizgi)}
header.ust h1{flex:1;margin:0;font-size:19px}
.ikonbtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--cizgi);background:var(--kart);font-size:18px;cursor:pointer}
main{padding:12px 16px 24px;max-width:760px;margin:0 auto}
nav.alt{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--kart);border-top:1px solid var(--cizgi);padding-bottom:env(safe-area-inset-bottom)}
nav.alt button{flex:1;min-height:58px;border:0;background:none;font-size:11px;color:var(--soluk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav.alt button b{font-size:20px;line-height:1}
nav.alt button[aria-current="true"]{color:var(--ana);font-weight:700}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--golge)}
.kart h2{margin:0 0 8px;font-size:16px}
.not{color:var(--soluk);font-size:13px}
.hata{background:var(--kotu-bg);color:var(--kotu);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.bilgi{background:var(--gri-bg);color:var(--gri);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.kutular{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:12px;text-align:left;cursor:pointer;box-shadow:var(--golge)}
.kutu .k{font-size:12px;color:var(--soluk)}.kutu .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kutu:disabled{cursor:default;opacity:1}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--gri-bg);color:var(--gri);white-space:nowrap}
.chip.iyi{background:var(--iyi-bg);color:var(--iyi)}.chip.uyar{background:var(--uyar-bg);color:var(--uyar)}.chip.kotu{background:var(--kotu-bg);color:var(--kotu)}
.liste{display:flex;flex-direction:column;gap:8px}
.satir{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:12px;display:block;width:100%;text-align:left;cursor:pointer}
.satir .bas{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.satir .ad{font-weight:700;overflow-wrap:anywhere}
.satir .alt{color:var(--soluk);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.satir.kapali{opacity:.65}
.sat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--cizgi);font-size:14px}
.sat:last-child{border-bottom:0}
.sat .not{flex-shrink:0}
.sag{text-align:right}
.mono{font-variant-numeric:tabular-nums}
.filtre{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.filtre .tam{grid-column:1/-1}
.dugmeler{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cubuk{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.cubuk .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.cubuk .c i{display:block;width:100%;border-radius:3px 3px 0 0;min-height:1px}
.cubuk .c i.u{background:var(--vurgu)}.cubuk .c i.t{background:var(--iyi);opacity:.8}
.cubuk .c span{font-size:10px;color:var(--soluk)}
.ikili{display:flex;gap:4px;align-items:flex-end;width:100%;height:calc(100% - 14px)}
.ikili i{flex:1}
.lej{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin:0 4px 0 8px}
.sayfa{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.sayfa header.ust{background:var(--bg)}
.perde{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.levha{background:var(--kart);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.levha h3{margin:0 0 4px;font-size:17px}
.levha p{margin:0 0 10px;color:var(--soluk);font-size:14px;white-space:pre-line}
.levha .secenek{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:80;background:var(--yazi);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;text-align:center;max-width:560px;margin:0 auto}
.giris-kutu{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 20px 32px}
.giris-kutu .logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.giris-kutu .logo img{width:52px;height:52px;border-radius:12px}
.giris-kutu h1{margin:0;font-size:22px}
.pin{letter-spacing:.4em;text-align:center;font-size:22px}
.kod{font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
.onay{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:15px;color:var(--yazi);margin:0}
.onay input{width:22px;height:22px;flex-shrink:0}
details summary{cursor:pointer;color:var(--soluk);font-size:14px;padding:6px 0}
.ayrac{height:1px;background:var(--cizgi);margin:12px 0}
[hidden]{display:none!important}
</style>
</head>
